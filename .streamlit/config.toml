[theme]
base = "dark"
primaryColor = "#9A5B16"
backgroundColor = "#0D0E10"
secondaryBackgroundColor = "#15171A"
textColor = "#F3EFE7"
font = "sans-serif"
headingFont = "serif"
codeFont = "monospace"

[server]
headless = true
enableXsrfProtection = true
maxUploadSize = 1

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "none"
toolbarMode = "minimal"
